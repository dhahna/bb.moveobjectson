# Uploads the site to SiteGround whenever main changes.
# Setup (one time): see docs/deploy.md. Until the secrets exist, this job skips itself.
name: Deploy to SiteGround

on:
  push:
    branches: [main]
    paths: ['*.html']
  workflow_dispatch:

concurrency: deploy-siteground

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check setup
        id: check
        env:
          KEY: ${{ secrets.SG_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::SiteGround secrets not set; nothing was deployed. See docs/deploy.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Upload HTML files
        if: steps.check.outputs.ready == 'true'
        env:
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PATH: ${{ secrets.SG_PATH }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SG_SSH_KEY" > ~/.ssh/sg && chmod 600 ~/.ssh/sg
          eval "$(ssh-agent -s)"
          if [ -n "$SG_SSH_PASSPHRASE" ]; then
            printf '#!/bin/sh\necho "$SG_SSH_PASSPHRASE"\n' > ~/.ssh/askpass && chmod 700 ~/.ssh/askpass
            DISPLAY=none SSH_ASKPASS=~/.ssh/askpass SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/sg </dev/null
          else
            ssh-add ~/.ssh/sg
          fi
          ssh-keyscan -p 18765 "$SG_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Only the site pages go up. No --delete, so WordPress and anything
          # else already on the server is left alone.
          rsync -avz -e "ssh -p 18765" ./*.html "$SG_USER@$SG_HOST:$SG_PATH/"

      - name: Check the live site
        if: steps.check.outputs.ready == 'true'
        run: |
          # Fetch each page back from the live site and compare it to what was
          # uploaded. A mismatch is a warning, not a failure: SiteGround's cache
          # can serve the old copy for a few minutes.
          ok=0; total=0
          for f in *.html; do
            total=$((total+1))
            url="https://bb.moveobjects.com/$f"; [ "$f" = index.html ] && url="https://bb.moveobjects.com/"
            code=$(curl -s -o /tmp/live.html -w '%{http_code}' "$url?v=$GITHUB_SHA")
            if [ "$code" != 200 ]; then echo "::warning::$url returned HTTP $code"; continue; fi
            if cmp -s "$f" /tmp/live.html; then echo "live matches: $f"; ok=$((ok+1));
            else echo "::warning::$url does not match the uploaded $f yet (cache?)"; fi
          done
          echo "$ok of $total pages verified live"
